name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# v13 P2-4: least-privilege default token
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
          pip install pip-audit
      - name: Ruff
        run: ruff check app tests
      - name: Pytest + coverage
        run: pytest -q -m "not integration" --tb=short --cov=app --cov-report=term-missing --cov-fail-under=78
        env:
          ADUPORT_PRIVATE_SAMPLES_DIR: ${{ github.workspace }}/backend/tests/fixtures/sample_pack
          ADUPORT_PRIVATE_SAMPLES_REQUIRED: "1"
      - name: Golden xlsx / span regression (no native)
        run: |
          pytest -q tests/test_golden_ast_xlsx.py tests/test_golden_xlsx_pipeline.py \
            tests/test_golden_odt_json_deep.py tests/test_exporter_spans.py \
            tests/test_target_format_registry.py tests/test_target_format_span_meta.py \
            tests/test_observability_pack.py --tb=short
      - name: pip-audit
        run: pip-audit --strict

  # D: 保真度 + 安全默认值回归门禁（跌破即 fail）
  fidelity-gates:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Fidelity / security / depth gates
        env:
          ADUPORT_PRIVATE_SAMPLES_DIR: ${{ github.workspace }}/backend/tests/fixtures/sample_pack
          ADUPORT_PRIVATE_SAMPLES_REQUIRED: "1"
        run: |
          pytest -q --tb=short \
            tests/test_ast_exporter_matrix.py \
            tests/test_fidelity_matrix_upgrades.py \
            tests/test_fidelity_export_fixes.py \
            tests/test_output_security_t4.py \
            tests/test_p0_batch_fixes.py \
            tests/test_sec01_auth_default.py \
            tests/test_job_token_t21.py \
            tests/test_docx_stub_writes.py \
            tests/test_docx_depth_v311.py \
            tests/test_depth_v317.py \
            tests/test_xlsx_charts_t35.py \
            tests/test_cov_ast_depth_n31.py \
            tests/test_ole_structured_t36.py \
            tests/test_golden_no_or_asserts_t28.py \
            tests/test_acceptance_pack.py \
            tests/test_sample_pack_t39.py \
            tests/test_v_g_corpus_inventory.py \
            tests/test_api_e2e_t40.py \
            tests/test_perf_ops_t18_t24.py \
            tests/test_roadmap_t10_t26.py \
            tests/test_ods_odp_export.py \
            tests/test_phase_a_xlsx_safe.py \
            tests/test_phase_ab_a3_b5.py \
            tests/test_phase_c_gates.py \
            tests/test_breadth_fidelity_tiers.py \
            tests/test_depth_ods_odp_v414.py \
            tests/test_cov_cold_paths_c.py \
            tests/test_cov_anydoc_ast_c.py \
            tests/test_private_samples_optional.py \
            tests/test_v5_defect_closure.py \
            tests/test_v6_t1_t4_closure.py \
            tests/test_audit_2026_09_fixes.py \
            tests/test_d24_d30_closure.py \
            tests/test_ab_contract.py \
            tests/test_sprint_illusion_ab_weasy.py \
            tests/test_xml_safe_no_et_fromstring.py \
            tests/test_roadmap_perf_warmup_gates.py \
            tests/test_cov_docling_utils.py \
            tests/test_cov_breadth_redbox.py \
            tests/test_edge_importers_depth.py \
            tests/test_score_baseline_e.py \
            tests/test_golden_xlsx_pipeline.py \
            tests/test_golden_ast_xlsx.py \
            tests/test_exporter_spans.py \
            tests/test_v11_features.py \
            tests/test_v8_bc_roadmap_gates.py \
            tests/test_v8_bcd_depth_roadmap.py \
            tests/test_fidelity_golden_v15.py \
            tests/test_v15_features.py \
            tests/test_v16_roundtrip_fidelity.py \
            tests/test_v17_roundtrip_fidelity.py \
            tests/test_recheck_v2_gates.py
      - name: Format matrix check
        env:
          PYTHONPATH: .
        run: python ../outputs/format_matrix.py --check

  # Optional customer acceptance corpus (defaults to in-repo sample_pack proxy)
  private-samples:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Private / acceptance sample gate
        env:
          ADUPORT_PRIVATE_SAMPLES_DIR: ${{ github.workspace }}/backend/tests/fixtures/sample_pack
          ADUPORT_PRIVATE_SAMPLES_REQUIRED: "1"
        run: |
          pytest -q --tb=short \
            tests/test_private_samples_optional.py \
            tests/test_sample_pack_t39.py \
            tests/test_v_g_corpus_inventory.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci || npm install
      - name: Smoke tests (T27)
        run: npm test
      - run: npm run build
      - name: Playwright E2E (Phase C)
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

  native-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@5cb072d7354962be830356aa6b146f7612846014  # v2.7.5
        with:
          workspaces: native/anydoc -> native/anydoc/target
      - name: Create venv + install backend
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/pip install -U pip
          backend/.venv/bin/pip install -e "backend/[dev]"
      - name: Cargo test (anydoc engine)
        working-directory: native/anydoc
        run: cargo test --workspace --lib -- --nocapture
      - name: Cargo clippy (T26)
        working-directory: native/anydoc
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build aduport_native
        run: bash scripts/build_native.sh
      - name: Assert no firecrawl-anydoc
        run: |
          backend/.venv/bin/python - <<'PY'
          import importlib.util as u
          assert u.find_spec("anydoc") is None, "firecrawl-anydoc must not be installed"
          import aduport_native._doc  # noqa: F401
          print("OK aduport_native only")
          PY
      - name: Fixture tests (docx/rtf/…)
        working-directory: backend
        run: |
          .venv/bin/pytest -q tests/test_anydoc_bridge.py tests/test_golden_matrix.py tests/test_golden_mobi_footnote.py tests/test_golden_ast_xlsx.py tests/test_golden_xlsx_pipeline.py tests/test_golden_odt_json_deep.py tests/test_exporter_spans.py --tb=short
