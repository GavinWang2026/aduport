# Publish AduPort to PyPI (Trusted Publishing / OIDC preferred).
#
# IMPORTANT: the published sdist/wheel is Python-only. Vendored anydoc
# (native/anydoc → aduport_native._doc) is NOT built or uploaded here.
# Prebuilt native wheels: .github/workflows/native-wheels.yml → GitHub Releases
# (scripts/install_native_wheel.sh). Full image path: Docker INSTALL_NATIVE=1
# or scripts/build_native.sh.
#
# One-time setup on https://pypi.org :
#   1. Create project "AduPort" (or claim name)
#   2. Publishing → Add a new pending publisher
#      - Owner: <github-org-or-user>
#      - Repository: AduPort
#      - Workflow: publish.yml
#      - Environment: pypi
#
# Fallback: set repository secret PYPI_API_TOKEN and uncomment the token block.

name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build only (skip upload)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    environment:
      name: pypi
      url: https://pypi.org/p/AduPort
    permissions:
      contents: read
      id-token: write  # Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install -U pip build twine

      - name: Verify version sync
        run: python ../scripts/check_version.py

      - name: Build sdist + wheel
        run: python -m build

      - name: Twine check
        run: twine check dist/*

      - name: Upload to PyPI
        if: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run) }}
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1
        with:
          packages-dir: backend/dist
          # For token auth instead of OIDC, set PYPI_API_TOKEN and use:
          # password: ${{ secrets.PYPI_API_TOKEN }}
