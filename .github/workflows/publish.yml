# Publish md-bridge to PyPI (Trusted Publishing / OIDC preferred).
#
# One-time setup on https://pypi.org :
#   1. Create project "md-bridge" (or claim name)
#   2. Publishing → Add a new pending publisher
#      - Owner: <github-org-or-user>
#      - Repository: md-bridge
#      - Workflow: publish.yml
#      - Environment: pypi
#
# Fallback: set repository secret PYPI_API_TOKEN and uncomment the token block.

name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build only (skip upload)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    environment:
      name: pypi
      url: https://pypi.org/p/md-bridge
    permissions:
      contents: read
      id-token: write  # Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install -U pip build twine

      - name: Verify version sync
        run: python ../scripts/check_version.py

      - name: Build sdist + wheel
        run: python -m build

      - name: Twine check
        run: twine check dist/*

      - name: Upload to PyPI
        if: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run) }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: backend/dist
          # For token auth instead of OIDC, set PYPI_API_TOKEN and use:
          # password: ${{ secrets.PYPI_API_TOKEN }}
