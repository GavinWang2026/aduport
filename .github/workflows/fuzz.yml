# Optional / nightly fuzz baselines (not on every PR).
name: Fuzz baselines

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"  # daily ~03:17 UTC

permissions:
  contents: read

jobs:
  ole-cfb-python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: ole_cfb mutation fuzz
        env:
          ADUPORT_FUZZ_ITERS: "2000"
          ADUPORT_FUZZ_SEED: "42"
        run: python scripts/fuzz_ole_cfb.py --timeout-sec 120

  # Smoke that native fuzz targets still build (full libfuzzer runs stay local/nightly cargo).
  anydoc-fuzz-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Install Rust nightly (fuzz)
        uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296  # nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked || cargo install cargo-fuzz
      - name: Build one fuzz target (xlsx)
        working-directory: native/anydoc
        run: cargo +nightly fuzz build xlsx
        continue-on-error: true
