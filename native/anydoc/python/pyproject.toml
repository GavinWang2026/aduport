[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

# AduPort's fused native parser. Ships as the `aduport-native` distribution
# and imports as `aduport_native._doc` (a single abi3 extension module).
[project]
name = "aduport-native"
description = "Convert documents (doc, docx, odt, rtf, epub, pdf, presentations, spreadsheets, csv) to GitHub-Flavored Markdown"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["markdown", "docx", "pdf", "pptx", "xlsx", "epub", "converter", "document"]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Typing :: Typed",
]
# The version comes from Cargo.toml `package.version`.
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/GavinWang2026/aduport"
Repository = "https://github.com/GavinWang2026/aduport"
Issues = "https://github.com/GavinWang2026/aduport/issues"
Documentation = "https://github.com/GavinWang2026/aduport/blob/main/native/anydoc/README.md"
# Prebuilt wheels: GitHub Releases asset aduport-native-wheels-*.tar.gz
# (not on the main AduPort PyPI artifact — product boundary).

[tool.maturin]
module-name = "aduport_native._doc"
