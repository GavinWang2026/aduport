[workspace]
# AduPort vendors only the Python binding crate; node/ and wasm/ are not part
# of the fused program and are excluded so `cargo`/maturin build a single target.
members = ["python"]
# cargo-fuzz keeps its own lockfile and nightly-only dependencies.
exclude = ["fuzz"]

[package]
name = "anydoc"
version = "0.2.4"
edition = "2024"
# Edition 2024 needs 1.85; zip raises it to 1.88.
rust-version = "1.88"
description = "Convert documents (doc, docx, odt, rtf, epub, pdf, presentations, spreadsheets, csv) to GitHub-Flavored Markdown"
license = "MIT"
repository = "https://github.com/firecrawl/anydoc"
readme = "README.md"
keywords = ["markdown", "docx", "pdf", "converter", "document"]
categories = ["parser-implementations", "text-processing"]
include = ["/src", "/examples/convert.rs", "/README.md", "/LICENSE"]

[dev-dependencies]
insta = "1"
sha2 = "0.11"

[dependencies]
cfb = "0.14.0"
csv = "1.4.0"
flate2 = "1"
encoding_rs = "0.8.35"
log = "0.4"
pdf-inspector = "1.14.2"
quick-xml = "0.41.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
# macOS 27 dyld rejects a release dylib whose symbol-string pool is only
# 4-byte aligned. Rust 1.97's strip pass does that; leave symbols in place.
strip = "none"
