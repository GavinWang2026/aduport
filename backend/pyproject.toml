[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aduport"
version = "0.16.0"
description = "Local document bidirectional converter (PDF/DOCX/Markdown/ODT/…)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Gavin Wang & HYHT Company" }]
keywords = ["markdown", "docx", "pdf", "converter", "document", "odt", "epub"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "typer>=0.12.0",
    "markdown-it-py>=3.0.0",
    "python-docx>=1.1.0",
    "python-pptx>=1.0.0",
    "weasyprint>=68.0",
    "pydantic-settings>=2.0.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.0.0",
    "fonttools>=4.53.0",
    "defusedxml>=0.7.1",
    # Own PDF text-layer backend (not via docling). Without this, pdf_text_char_count
    # silently returns 0 and digital PDFs are misclassified as scan-only.
    "pypdfium2>=4.30.0",
]

[project.optional-dependencies]
office = [
    "docling>=2.0.0",
]
images = [
    "Pillow>=10.0.0",
]
# Heavy optional OCR stacks — install on GPU hosts / enterprise full image only.
# Stay on MinerU 3.x: 4.0 dropped the pipeline extra and requires transformers>=5,
# which this pin (and mineru.cli.common.do_parse) does not support.
ocr-mineru = [
    "mineru[pipeline]>=2.0.0,<4",
    "transformers>=4.57.3,<5.0.0",
]
ocr-paddle = [
    "paddleocr>=3.0.0",
    "paddlex[ocr]>=3.0.0",
]
ocr = [
    "aduport[ocr-mineru,ocr-paddle]",
]
embed = [
    "fastembed>=0.4.0",
]
mcp = [
    "mcp>=1.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-timeout>=2.3.0",
    "pytest-randomly>=3.15.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "pytest-cov>=5.0.0",
    "build>=1.2.0",
    "twine>=5.0.0",
]
all = [
    "aduport[office,images,dev,mcp]",
]

[project.urls]
Homepage = "https://github.com/GavinWang2026/aduport"
Documentation = "https://github.com/GavinWang2026/aduport#readme"
Repository = "https://github.com/GavinWang2026/aduport"
Issues = "https://github.com/GavinWang2026/aduport/issues"
Changelog = "https://github.com/GavinWang2026/aduport/blob/main/CHANGELOG.md"

[project.scripts]
aduport = "aduport.cli:main"
aduport-mcp = "aduport.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["aduport"]

# Serve command (`aduport serve`) needs the ASGI entry module inside the wheel,
# otherwise `uvicorn main:app` cannot resolve after a plain `pip install`.
[tool.hatch.build.targets.wheel.force-include]
"main.py" = "main.py"
# Apache-2.0 §4(d) 与 anydoc 的 MIT 署名要求：NOTICE 必须随发行物一起走。
# 只放一份在仓库根，靠 force-include 引用，避免两份文件内容漂移。
"../NOTICE" = "NOTICE"
"../THIRD_PARTY_NOTICES.md" = "THIRD_PARTY_NOTICES.md"

[tool.hatch.build.targets.sdist]
include = [
    "aduport",
    "main.py",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

# sdist 同样要带 NOTICE（Apache-2.0 §4(d) + anydoc MIT 署名），
# 只存在于仓库根，故用 force-include 引入，避免两份副本漂移。
[tool.hatch.build.targets.sdist.force-include]
"../NOTICE" = "NOTICE"
"../THIRD_PARTY_NOTICES.md" = "THIRD_PARTY_NOTICES.md"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501", "W291"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# pytest-randomly (dev extra) shuffles test order to expose cross-file pollution.
# Nightly runs a seeded shuffle subset; local: pytest -p randomly --randomly-seed=...
# Disable plugin: pytest -p no:randomly
addopts = "--basetemp=.pytest-tmp"
timeout = 120
timeout_method = "thread"
markers = [
    "integration: optional live OCR tests (requires mineru/paddle extras)",
]
