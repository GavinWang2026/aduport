[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "md-bridge"
version = "0.16.0"
description = "Local document bidirectional converter (PDF/DOCX/Markdown/ODT/…)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "md-bridge contributors" }]
keywords = ["markdown", "docx", "pdf", "converter", "document", "odt", "epub"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "typer>=0.12.0",
    "markdown-it-py>=3.0.0",
    "python-docx>=1.1.0",
    "python-pptx>=1.0.0",
    "weasyprint>=62.0",
    "pydantic-settings>=2.0.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.0.0",
    "fonttools>=4.53.0",
    # Own PDF text-layer backend (not via docling). Without this, pdf_text_char_count
    # silently returns 0 and digital PDFs are misclassified as scan-only.
    "pypdfium2>=4.30.0",
]

[project.optional-dependencies]
office = [
    "docling>=2.0.0",
]
images = [
    "Pillow>=10.0.0",
]
# Heavy optional OCR stacks — install on GPU hosts / enterprise full image only
# mineru[pipeline] requires transformers<5; pin so pip does not pull 5.x from other extras
ocr-mineru = [
    "mineru[pipeline]>=2.0.0",
    "transformers>=4.57.3,<5.0.0",
]
ocr-paddle = [
    "paddleocr>=3.0.0",
    "paddlex[ocr]>=3.0.0",
]
ocr = [
    "md-bridge[ocr-mineru,ocr-paddle]",
]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "pytest-cov>=5.0.0",
    "build>=1.2.0",
    "twine>=5.0.0",
]
all = [
    "md-bridge[office,images,dev]",
]

[project.urls]
Homepage = "https://github.com/crayfish-team/md-bridge"
Documentation = "https://github.com/crayfish-team/md-bridge#readme"
Repository = "https://github.com/crayfish-team/md-bridge"
Issues = "https://github.com/crayfish-team/md-bridge/issues"
Changelog = "https://github.com/crayfish-team/md-bridge/blob/main/CHANGELOG.md"

[project.scripts]
mdbridge = "app.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.sdist]
include = [
    "app",
    "main.py",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501", "W291"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: optional live OCR tests (requires mineru/paddle extras)",
]
