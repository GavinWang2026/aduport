[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "md-bridge"
version = "0.11.0"
description = "Local document bidirectional converter (PDF/DOCX/Markdown)"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "md-bridge contributors" }]
keywords = ["markdown", "docx", "pdf", "converter", "document"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "typer>=0.12.0",
    "markdown-it-py>=3.0.0",
    "python-docx>=1.1.0",
    "python-pptx>=1.0.0",
    "weasyprint>=62.0",
    "pydantic-settings>=2.0.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
office = [
    "docling>=2.0.0",
]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "pytest-cov>=5.0.0",
]
all = [
    "md-bridge[office,dev]",
]

[project.scripts]
mdbridge = "app.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.sdist]
include = ["app", "main.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501", "W291"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
