services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        INSTALL_NATIVE: "${INSTALL_NATIVE:-1}"
    container_name: md-bridge-backend
    # Bind to loopback only — do not expose on LAN by default
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=Asia/Shanghai
      - MDBRIDGE_JOB_DB_PATH=/data/jobs.sqlite3
      - MDBRIDGE_AUDIT_LOG_PATH=/data/logs/audit.jsonl
    volumes:
      - mdbridge-data:/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: md-bridge-frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mdbridge-data:
