# Overlay: use slim backend (no docling). MD→DOCX/PDF + MD roundtrip only.
# Usage: docker compose -f docker-compose.yml -f docker-compose.slim.yml up --build
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.slim
      args:
        INSTALL_NATIVE: "${INSTALL_NATIVE:-1}"
    image: aduport-backend:slim
