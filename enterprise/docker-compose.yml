# Enterprise private deployment — persistent volumes + offline-friendly defaults.
# Build from repo root: docker compose -f enterprise/docker-compose.yml build

services:
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      args:
        INSTALL_OFFICE: "1"
        # Set "0" to skip Hub bake when mirrors/Xet fail; mount models at runtime instead
        BAKE_DOCLING_MODELS: "${BAKE_DOCLING_MODELS:-1}"
    image: md-bridge-backend:enterprise
    container_name: md-bridge-backend
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
      MDBRIDGE_DOCLING_OFFLINE: "true"
      MDBRIDGE_OCR_ENABLED: "false"
      MDBRIDGE_JOB_DB_PATH: /data/jobs.sqlite3
      MDBRIDGE_AUDIT_LOG_PATH: /data/logs/audit.jsonl
      MDBRIDGE_VIRUS_SCAN_FAIL_CLOSED: "true"
    volumes:
      - mdbridge-data:/data

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    image: md-bridge-frontend:enterprise
    container_name: md-bridge-frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mdbridge-data:
