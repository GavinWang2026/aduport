# Scrape md-bridge backend metrics (use with docker compose --profile observability)
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/mdbridge.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: mdbridge
    metrics_path: /api/metrics
    static_configs:
      - targets: ["backend:8000"]
